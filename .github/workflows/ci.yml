name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORTOOLS_URL: https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz
  ORTOOLS_SHA256: 6f389320672cee00b78aacefb2bde33fef0bb988c3b2735573b9fffd1047fbda

jobs:
  test:
    name: Linux x64 · Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache OR-Tools
        id: ortools-cache
        uses: actions/cache@v4
        with:
          path: ~/or-tools
          key: ortools-${{ env.ORTOOLS_SHA256 }}

      - name: Download OR-Tools C++ release
        if: steps.ortools-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ortools.tar.gz" "$ORTOOLS_URL"
          echo "$ORTOOLS_SHA256  $RUNNER_TEMP/ortools.tar.gz" | sha256sum --check -
          mkdir -p ~/or-tools
          tar -xzf "$RUNNER_TEMP/ortools.tar.gz" -C ~/or-tools --strip-components=1

      - name: Point the build at OR-Tools
        run: echo "ORTOOLS_ROOT=$HOME/or-tools" >> "$GITHUB_ENV"

      - name: Install and build the addon
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Run the example
        run: npm run example
