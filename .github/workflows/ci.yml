name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux ${{ matrix.platform.arch }} · OR-Tools ${{ matrix.ortools.version }} · Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        platform:
          - { arch: x64, runner: ubuntu-24.04, archive: amd64_ubuntu-24.04 }
          # Google publishes Linux arm64 C++ archives only for AlmaLinux 8.10 (glibc 2.28).
          - { arch: arm64, runner: ubuntu-24.04-arm, archive: aarch64_AlmaLinux-8.10 }
        ortools:
          - { version: 9.14.6206, tag: v9.14 }
          - { version: 9.15.6755, tag: v9.15 }
    env:
      ORTOOLS_ARCHIVE: or-tools_${{ matrix.platform.archive }}_cpp_v${{ matrix.ortools.version }}.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache OR-Tools
        id: ortools-cache
        uses: actions/cache@v4
        with:
          path: ~/or-tools
          key: ortools-${{ env.ORTOOLS_ARCHIVE }}

      - name: Download OR-Tools C++ release
        if: steps.ortools-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ortools.tar.gz" \
            "https://github.com/google/or-tools/releases/download/${{ matrix.ortools.tag }}/$ORTOOLS_ARCHIVE"
          expected=$(grep -F " $ORTOOLS_ARCHIVE" .github/ortools-sha256.txt | cut -d' ' -f1)
          test -n "$expected" || { echo "No pinned SHA-256 for $ORTOOLS_ARCHIVE"; exit 1; }
          echo "$expected  $RUNNER_TEMP/ortools.tar.gz" | sha256sum --check -
          mkdir -p ~/or-tools
          tar -xzf "$RUNNER_TEMP/ortools.tar.gz" -C ~/or-tools --strip-components=1

      - name: Point the build at OR-Tools
        run: echo "ORTOOLS_ROOT=$HOME/or-tools" >> "$GITHUB_ENV"

      - name: Install and build the addon
        run: npm ci

      - name: Test
        run: npm test

      - name: Check the loaded OR-Tools version
        run: node -e "const v=require('.').ortoolsVersion; if (v !== '${{ matrix.ortools.version }}') throw new Error(v)"

      - name: Type-check
        run: npm run typecheck

      - name: Run the example
        run: npm run example
